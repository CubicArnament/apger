apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apger.fullname" . }}
  labels:
    {{- include "apger.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apger.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apger.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "apger.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apger
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          env:
            - name: APGER_ADDRESS
              value: :8080
            - name: APGER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APGER_BUILDER_IMAGE
              value: "{{ .Values.workerImage.repository }}:{{ default .Chart.AppVersion .Values.workerImage.tag }}"
            - name: APGER_IMAGE_PULL_POLICY
              value: {{ .Values.workerImage.pullPolicy | quote }}
            - name: APGER_OUTPUT_PVC
              value: {{ include "apger.outputPVC" . | quote }}
            {{- if or .Values.persistence.cache.create .Values.persistence.cache.existingClaim }}
            - name: APGER_CACHE_PVC
              value: {{ include "apger.cachePVC" . | quote }}
            {{- end }}
            - name: APGER_JOB_TTL
              value: {{ .Values.config.jobTTL | quote }}
            - name: APGER_BUILD_TIMEOUT
              value: {{ .Values.config.buildTimeout | quote }}
            - name: APGER_MAX_PKGBUILD_BYTES
              value: {{ .Values.config.maxPKGBUILDBytes | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
