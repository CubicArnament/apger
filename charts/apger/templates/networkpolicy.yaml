{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "apger.fullname" . }}
  labels:
    {{- include "apger.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apger.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
{{- end }}
